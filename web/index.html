<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SansaVRM Studio AI</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #fafafa;
    }

    section {
      margin-bottom: 32px;
      border: 1px solid #ccc;
      padding: 12px;
      background: #fff;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eee;
    }

    .toolbar {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
    }

    .status-completed {
      font-weight: bold;
    }

    .status-failed {
      color: red;
      font-weight: bold;
    }

    .diagnostic-denied {
      color: red;
      font-weight: bold;
    }

    .muted {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="language-select">Language:</label>
    <select id="language-select">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>

    <button id="run-demo-workflow-button"></button>
    <button id="run-denied-workflow-button"></button>
  </div>

  <h1 id="page-title">SansaVRM Studio AI</h1>
  <p class="muted" id="page-subtitle"></p>

  <section>
    <h2 id="project-summary-title"></h2>
    <pre id="project-summary"></pre>
  </section>

  <section>
    <h2 id="governance-diagnostics-title"></h2>
    <table id="governance-table">
      <thead>
        <tr>
          <th>workflow_run_id</th>
          <th>step_id</th>
          <th>operation</th>
          <th>allowed</th>
          <th>reason</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2 id="artifacts-title"></h2>
    <table id="artifact-table">
      <thead>
        <tr>
          <th id="artifact-id-header"></th>
          <th id="artifact-type-header"></th>
          <th id="artifact-path-header"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2 id="workflow-runs-title"></h2>
    <table id="workflow-table">
      <thead>
        <tr>
          <th id="workflow-run-id-header"></th>
          <th id="workflow-type-header"></th>
          <th id="workflow-status-header"></th>
          <th id="workflow-local-only-header"></th>
          <th id="workflow-steps-header"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2 id="graph-title"></h2>
    <table id="graph-table">
      <thead>
        <tr>
          <th id="graph-artifact-header"></th>
          <th id="graph-created-by-header"></th>
          <th id="graph-depends-on-header"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
    const translations = {
      ja: {
        subtitle: 'Governance-aware validation UI',
        projectSummary: 'Project Summary',
        governanceDiagnostics: 'Governance Diagnostics',
        artifacts: 'Artifacts',
        workflowRuns: 'Workflow Runs',
        dependencyGraph: 'Artifact Dependency Graph',
        runDemoWorkflow: 'Demo Workflow 実行',
        runDeniedWorkflow: 'Denied Workflow 実行',
        artifactId: 'artifact_id',
        artifactType: 'artifact_type',
        path: 'path',
        workflowRunId: 'workflow_run_id',
        workflowType: 'workflow_type',
        status: 'status',
        localOnly: 'local_only',
        steps: 'steps',
        createdBy: 'created_by_step',
        dependsOn: 'depends_on'
      },
      en: {
        subtitle: 'Governance-aware validation UI',
        projectSummary: 'Project Summary',
        governanceDiagnostics: 'Governance Diagnostics',
        artifacts: 'Artifacts',
        workflowRuns: 'Workflow Runs',
        dependencyGraph: 'Artifact Dependency Graph',
        runDemoWorkflow: 'Run Demo Workflow',
        runDeniedWorkflow: 'Run Denied Workflow',
        artifactId: 'artifact_id',
        artifactType: 'artifact_type',
        path: 'path',
        workflowRunId: 'workflow_run_id',
        workflowType: 'workflow_type',
        status: 'status',
        localOnly: 'local_only',
        steps: 'steps',
        createdBy: 'created_by_step',
        dependsOn: 'depends_on'
      }
    };

    let currentLanguage = localStorage.getItem('svsa_ui_language') || 'ja';

    function t(key) {
      return translations[currentLanguage]?.[key] || key;
    }

    function applyTranslations() {
      document.documentElement.lang = currentLanguage;

      document.getElementById('page-subtitle').textContent = t('subtitle');
      document.getElementById('project-summary-title').textContent = t('projectSummary');
      document.getElementById('governance-diagnostics-title').textContent = t('governanceDiagnostics');
      document.getElementById('artifacts-title').textContent = t('artifacts');
      document.getElementById('workflow-runs-title').textContent = t('workflowRuns');
      document.getElementById('graph-title').textContent = t('dependencyGraph');
      document.getElementById('run-demo-workflow-button').textContent = t('runDemoWorkflow');
      document.getElementById('run-denied-workflow-button').textContent = t('runDeniedWorkflow');

      document.getElementById('artifact-id-header').textContent = t('artifactId');
      document.getElementById('artifact-type-header').textContent = t('artifactType');
      document.getElementById('artifact-path-header').textContent = t('path');

      document.getElementById('workflow-run-id-header').textContent = t('workflowRunId');
      document.getElementById('workflow-type-header').textContent = t('workflowType');
      document.getElementById('workflow-status-header').textContent = t('status');
      document.getElementById('workflow-local-only-header').textContent = t('localOnly');
      document.getElementById('workflow-steps-header').textContent = t('steps');

      document.getElementById('graph-artifact-header').textContent = t('artifactId');
      document.getElementById('graph-created-by-header').textContent = t('createdBy');
      document.getElementById('graph-depends-on-header').textContent = t('dependsOn');
    }

    document.getElementById('language-select').value = currentLanguage;

    document.getElementById('language-select').addEventListener('change', (event) => {
      currentLanguage = event.target.value;
      localStorage.setItem('svsa_ui_language', currentLanguage);
      applyTranslations();
    });

    document.getElementById('run-demo-workflow-button').addEventListener('click', async () => {
      await fetch('/api/workflows/demo/run', {
        method: 'POST'
      });

      await refreshAll();
    });

    document.getElementById('run-denied-workflow-button').addEventListener('click', async () => {
      await fetch('/api/workflows/demo/run?deny_decomposition=true', {
        method: 'POST'
      });

      await refreshAll();
    });

    async function loadProject() {
      const response = await fetch('/api/project');
      const data = await response.json();

      document.getElementById('project-summary').textContent = JSON.stringify(data, null, 2);
    }

    async function loadGovernanceDiagnostics() {
      const response = await fetch('/api/governance-diagnostics');
      const data = await response.json();

      const tbody = document.querySelector('#governance-table tbody');
      tbody.innerHTML = '';

      data.diagnostics.forEach(diag => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${diag.workflow_run_id}</td>
          <td>${diag.step_id}</td>
          <td>${diag.operation}</td>
          <td class="diagnostic-denied">${diag.allowed}</td>
          <td>${diag.reason}</td>
        `;

        tbody.appendChild(row);
      });
    }

    async function loadArtifacts() {
      const response = await fetch('/api/artifacts');
      const data = await response.json();

      const tbody = document.querySelector('#artifact-table tbody');
      tbody.innerHTML = '';

      data.artifacts.forEach(artifact => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${artifact.artifact_id}</td>
          <td>${artifact.artifact_type}</td>
          <td>${artifact.path}</td>
        `;

        tbody.appendChild(row);
      });
    }

    async function loadWorkflowRuns() {
      const response = await fetch('/api/workflow-runs');
      const data = await response.json();

      const tbody = document.querySelector('#workflow-table tbody');
      tbody.innerHTML = '';

      data.workflow_runs.forEach(run => {
        const row = document.createElement('tr');
        const steps = (run.steps || []).map(step => `${step.step_id} (${step.step_type}: ${step.status})`).join('<br>');

        row.innerHTML = `
          <td>${run.workflow_run_id}</td>
          <td>${run.workflow_type}</td>
          <td class="status-${run.status}">${run.status}</td>
          <td>${run.local_only}</td>
          <td>${steps}</td>
        `;

        tbody.appendChild(row);
      });
    }

    async function loadWorkflowGraph() {
      const response = await fetch('/api/workflow-graph');
      const data = await response.json();

      const graph = data.dependency_graph || {};
      const tbody = document.querySelector('#graph-table tbody');
      tbody.innerHTML = '';

      Object.values(graph).forEach(entry => {
        const row = document.createElement('tr');
        const dependsOn = (entry.depends_on || []).join('<br>');

        row.innerHTML = `
          <td>${entry.artifact_id}</td>
          <td>${entry.created_by_step}</td>
          <td>${dependsOn}</td>
        `;

        tbody.appendChild(row);
      });
    }

    async function refreshAll() {
      await loadProject();
      await loadGovernanceDiagnostics();
      await loadArtifacts();
      await loadWorkflowRuns();
      await loadWorkflowGraph();
    }

    async function initialize() {
      applyTranslations();
      await refreshAll();
    }

    initialize();
  </script>
</body>
</html>
